<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<title>LinguaQuest Family</title>
<style>
:root{
  --bg:#f7f7fb; --card:#ffffff; --ink:#1d2440; --muted:#6f7690;
  --primary:#6c5ce7; --primary2:#8b7cf6; --accent:#ffb703; --good:#19b37d;
  --bad:#ef476f; --blue:#4ea8de; --orange:#ff8a4c; --border:#e8e9f2;
  --shadow:0 14px 32px rgba(55,48,107,.10); --radius:24px;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); background:
  radial-gradient(circle at 10% 0%, #ede9ff 0, transparent 28%),
  radial-gradient(circle at 90% 10%, #fff0d4 0, transparent 25%), var(--bg);
  font-family:Inter,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
.sidebar{
  padding:26px 18px; background:rgba(255,255,255,.82); backdrop-filter:blur(14px);
  border-right:1px solid var(--border); position:sticky; top:0; height:100vh;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 24px}
.brandMark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),#9b5de5); color:#fff;font-size:27px;box-shadow:var(--shadow)}
.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}
.nav{display:grid;gap:8px}
.nav button{
  width:100%; border:0; background:transparent; color:var(--muted); padding:13px 14px;
  border-radius:16px; text-align:left; font-weight:750; display:flex; gap:11px;align-items:center
}
.nav button.active,.nav button:hover{background:#f0edff;color:var(--primary)}
.sideBottom{position:absolute;bottom:22px;left:18px;right:18px}
.profileMini{padding:12px;border:1px solid var(--border);border-radius:18px;background:#fff;display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#eee9ff}
.main{padding:26px 32px 70px;max-width:1400px;width:100%;margin:auto}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}
.greeting h2{margin:0 0 6px;font-size:28px}.greeting p{margin:0;color:var(--muted)}
.topstats{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:10px 14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.hero{grid-column:span 8;min-height:280px;background:linear-gradient(135deg,#6250dc,#8a76f3);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.10);right:-40px;top:-35px}
.hero .eyebrow{opacity:.83;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero h3{font-size:34px;max-width:560px;margin:14px 0 10px}.hero p{max-width:600px;line-height:1.6;opacity:.93}
.primary{border:0;border-radius:16px;padding:13px 18px;background:#fff;color:var(--primary);font-weight:900}
.secondary{border:1px solid var(--border);border-radius:14px;padding:11px 15px;background:#fff;color:var(--ink);font-weight:800}
.heroActions{display:flex;gap:10px;margin-top:22px}
.companionCard{grid-column:span 4;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.mascot{font-size:80px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.12));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.speech{margin-top:10px;background:#fff9df;border:1px solid #ffe58f;border-radius:18px;padding:14px 16px;line-height:1.5}
.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:28px 0 12px}
.sectionTitle h3{margin:0;font-size:22px}.sectionTitle p{margin:4px 0 0;color:var(--muted);font-size:14px}
.skill{grid-column:span 3}
.skillTop{display:flex;justify-content:space-between;align-items:center}.skillIcon{font-size:27px}
.bar{height:10px;background:#eef0f6;border-radius:999px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));border-radius:999px}
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.world{position:relative;border:1px solid var(--border);background:#fff;border-radius:20px;padding:18px;text-align:left;min-height:150px;box-shadow:0 8px 20px rgba(0,0,0,.04)}
.world:hover{transform:translateY(-2px);transition:.2s;box-shadow:var(--shadow)}
.world.locked{opacity:.56;filter:saturate(.7)}
.world .tag{font-size:12px;font-weight:900;color:var(--primary);background:#f0edff;padding:6px 9px;border-radius:999px;display:inline-block}
.world h4{margin:13px 0 6px;font-size:18px}.world p{color:var(--muted);margin:0;line-height:1.45;font-size:14px}
.world .emoji{font-size:35px;position:absolute;right:16px;top:16px}
.questList,.rewardGrid,.childGrid{display:grid;gap:14px}
.quest{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.quest h4{margin:0 0 4px}.quest p{margin:0;color:var(--muted);font-size:14px}
.coin{font-weight:900;color:#b56b00}.xp{font-weight:900;color:var(--primary)}
.rewardGrid{grid-template-columns:repeat(3,1fr)}
.reward{padding:18px;border:1px solid var(--border);border-radius:20px;background:#fff}
.reward .art{font-size:46px}.reward h4{margin:10px 0 4px}.reward p{color:var(--muted);min-height:40px;margin:0 0 12px}
.price{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:850;font-size:12px;background:#f2f4f8;color:#606980}
.tabstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabstrip button{border:1px solid var(--border);background:#fff;padding:9px 12px;border-radius:999px;font-weight:800;color:var(--muted)}.tabstrip button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.hidden{display:none!important}
.modalBackdrop{position:fixed;inset:0;background:rgba(25,25,46,.52);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:50}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:30px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{border:0;background:#f2f3f8;border-radius:50%;width:40px;height:40px}
.lessonMascot{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center;background:#fff9df;border:1px solid #ffe6a7;border-radius:20px;padding:14px;margin:18px 0}
.lessonMascot .mascot{font-size:58px}.lessonMascot p{margin:3px 0;line-height:1.5}
.taskBox{padding:20px;border:1px solid var(--border);border-radius:22px;background:#fbfbfe}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.choice{padding:14px;border-radius:15px;background:#fff;border:2px solid var(--border);font-weight:800}
.choice:hover{border-color:#bdb4ff}.choice.good{border-color:var(--good);background:#ecfbf5}.choice.bad{border-color:var(--bad);background:#fff0f3}
.inputRow{display:flex;gap:10px;margin-top:14px}.inputRow input{flex:1;padding:13px 14px;border:2px solid var(--border);border-radius:14px;outline:none}.inputRow input:focus{border-color:var(--primary)}
.actionRow{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.bigPrimary{border:0;border-radius:15px;padding:13px 18px;background:var(--primary);color:#fff;font-weight:900}
.progressLine{height:10px;background:#eceef5;border-radius:999px;overflow:hidden;margin:14px 0}.progressLine i{height:100%;display:block;background:linear-gradient(90deg,var(--primary),#19b37d)}
.confetti{font-size:50px;text-align:center}
.parentGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}.table th{color:var(--muted)}
.switcher{display:flex;gap:8px;flex-wrap:wrap}.childBtn{border:1px solid var(--border);background:#fff;border-radius:14px;padding:10px 12px;font-weight:800}.childBtn.active{border-color:var(--primary);background:#f0edff;color:var(--primary)}
.notice{padding:14px 16px;border-radius:16px;background:#eef8ff;color:#23658f;border:1px solid #cfeaff}
.goal{background:linear-gradient(135deg,#fff4d6,#fff);border:1px solid #ffe1a0}
.goal .bar i{background:linear-gradient(90deg,#ffb703,#ff8a4c)}
.footer{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
@media(max-width:980px){
 .app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:30;bottom:0;top:auto;height:auto;width:100%;padding:8px 10px;border-right:0;border-top:1px solid var(--border)}
 .brand,.sideBottom{display:none}.nav{grid-template-columns:repeat(5,1fr)}.nav button{justify-content:center;text-align:center;font-size:11px;flex-direction:column;gap:3px;padding:7px 4px}.main{padding:22px 18px 100px}
 .hero,.companionCard{grid-column:span 12}.skill{grid-column:span 6}.worlds,.rewardGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
 .topbar{align-items:flex-start;flex-direction:column}.greeting h2{font-size:24px}.hero h3{font-size:27px}.skill{grid-column:span 12}.worlds,.rewardGrid,.parentGrid{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.lessonMascot{grid-template-columns:64px 1fr}.lessonMascot .mascot{font-size:46px}
}

/* V2 lively game layer */
:root{--primary:#7c3aed;--primary2:#a855f7;--accent:#ffca3a;--pink:#ff5da2;--green:#23c483;--blue:#45a3ff}
body{background:radial-gradient(circle at 7% 3%,rgba(255,202,58,.20),transparent 22%),radial-gradient(circle at 92% 5%,rgba(255,93,162,.16),transparent 25%),radial-gradient(circle at 40% 100%,rgba(69,163,255,.14),transparent 32%),#f8f7ff}
.brandMark{background:linear-gradient(135deg,var(--primary),var(--pink));box-shadow:0 12px 28px rgba(124,58,237,.28);position:relative;overflow:hidden}
.brandMark:after{content:"";position:absolute;width:24px;height:70px;background:rgba(255,255,255,.25);transform:rotate(30deg);left:-30px;animation:shine 4s infinite}@keyframes shine{0%,65%{left:-30px}85%,100%{left:75px}}
.nav button{transition:.18s}.nav button:hover{transform:translateX(3px)}
.hero{background:radial-gradient(circle at 90% 15%,rgba(255,255,255,.18),transparent 27%),linear-gradient(135deg,#6836d8,#8d52ee 57%,#cb59ca)}
.hero:before{content:"✨";font-size:88px;position:absolute;right:34px;bottom:18px;opacity:.18;transform:rotate(12deg)}
.world,.reward{transition:.2s}.world:hover,.reward:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.rewardGrid{grid-template-columns:repeat(4,1fr)}
.cloudOnline{color:#117a58}.cloudLocal{color:#805b12}
.cloudBox{background:linear-gradient(135deg,#f0edff,#fff);border:1px solid #dcd4ff}
.formField{display:grid;gap:6px;margin:12px 0}.formField label{font-size:13px;font-weight:850;color:var(--muted)}
.formField input,.formField textarea,.formField select{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:15px;outline:none;background:#fff}
.recordBox{margin-top:14px;padding:14px;border-radius:18px;border:1px solid #dfe4f4;background:#f8faff}
.recordPulse{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--bad);margin-right:7px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
.audioPlayer{width:100%;margin-top:12px}
.notice.good{background:#ecfbf5;color:#147253;border-color:#c9f1df}.notice.warn{background:#fff8e2;color:#7f5b13;border-color:#ffe4a0}
.starBurst{position:fixed;pointer-events:none;font-size:24px;z-index:100;animation:burst .8s forwards}@keyframes burst{to{transform:translateY(-80px) rotate(80deg) scale(1.8);opacity:0}}
@media(max-width:1100px){.rewardGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:980px){.rewardGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.rewardGrid{grid-template-columns:1fr}}

</style>
</head>

function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem("linguaquest-state"));
    if(!s) return structuredClone(defaultState);
    return {...structuredClone(defaultState),...s, children:{...structuredClone(defaultState).children,...(s.children||{})}};
  }catch(e){return structuredClone(defaultState)}
}

function activeFirebaseConfig(){
 const saved=localStorage.getItem("linguaquest-firebase-config");if(saved){try{return JSON.parse(saved)}catch(e){}}
 return BUILT_IN_FIREBASE_CONFIG;
}
function firebaseConfigReady(c){return !!(c&&c.apiKey&&c.projectId&&c.appId)}
function cloudStatus(){return fbUser?'<span class="cloudOnline">☁️ Synced</span>':firebaseConfigReady(activeFirebaseConfig())?'<span class="cloudLocal">☁️ Sign in</span>':'<span class="cloudLocal">💾 Local mode</span>'}
async function initFirebase(){
 const cfg=activeFirebaseConfig();if(!firebaseConfigReady(cfg)){refreshVisible();return false}
 try{
  if(!firebase.apps.length)fbApp=firebase.initializeApp(cfg);else fbApp=firebase.app();
  fbAuth=firebase.auth();fbDb=firebase.firestore();fbStorage=firebase.storage();
  fbAuth.onAuthStateChanged(u=>{fbUser=u||null;if(fbUser)startCloudSync();else{if(fbUnsub)fbUnsub();fbUnsub=null;refreshVisible()}});refreshVisible();return true;
 }catch(e){console.error(e);alert("Firebase could not initialize: "+e.message);return false}
}
function startCloudSync(){
 if(!fbUser||!fbDb)return;if(fbUnsub)fbUnsub();
 const ref=fbDb.doc(`users/${fbUser.uid}/app/state`);
 fbUnsub=ref.onSnapshot(async snap=>{
  if(snap.exists){cloudApplying=true;const d=snap.data();state={...state,...d,children:{...(d.children||state.children)}};state.audioOverrides=state.audioOverrides||{};state.speakingRecordings=state.speakingRecordings||[];localStorage.setItem("linguaquest-state",JSON.stringify(state));cloudApplying=false;refreshVisible();}
  else{await ref.set(state)}
 },e=>console.warn("Cloud sync",e));refreshVisible();
}
function save(){
 localStorage.setItem("linguaquest-state",JSON.stringify(state));
 if(fbUser&&fbDb&&!cloudApplying){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>fbDb.doc(`users/${fbUser.uid}/app/state`).set(state).catch(console.warn),180)}
}
async function firebaseLogin(create){

 if(!fbAuth){const ok=await initFirebase();if(!ok){alert("Add your Firebase config first.");return}}
 try{if(create)await fbAuth.createUserWithEmailAndPassword(email,password);else await fbAuth.signInWithEmailAndPassword(email,password);renderParent()}catch(e){alert((create?"Account creation":"Sign in")+" failed: "+e.message)}
}
async function cloudSignOut(){if(fbAuth)await fbAuth.signOut();renderParent()}

 `<div class="switcher">${Object.entries(state.children).map(([id,k])=>`<button class="childBtn ${id===state.activeChild?"active":""}" onclick="switchChild('${id}')">${k.avatar} ${esc(k.name)}</button>`).join("")}<button class="childBtn" onclick="addChild()">＋ Add child</button></div>
 <div class="sectionTitle"><div><h3>☁️ Firebase family sync</h3><p>One family account, separate child balances.</p></div></div>${firebasePanel()}
 <div class="sectionTitle"><div><h3>${c.avatar} ${esc(c.name)} overview</h3><p>${levelName(c.xp)} · ${c.xp} XP · ${c.coins} coins</p></div></div>
 <div class="parentGrid"><div class="card"><h3>Pending chore approvals</h3>${(c.pendingChores||[]).length?c.pendingChores.map(id=>{const q=state.chores.find(x=>x.id===id);return `<div class="quest"><div><h4>${q.name}</h4><p>${q.zh}</p></div><div><button class="bigPrimary" onclick="approveChore('${id}')">Approve +${q.coins}</button> <button class="secondary" onclick="rejectChore('${id}')">Not yet</button></div></div>`}).join(""):`<p style="color:var(--muted)">Nothing waiting right now.</p>`}</div>
 <div class="card"><h3>Learning mastery</h3>${["listening","speaking","reading","writing"].map(x=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between"><b>${x[0].toUpperCase()+x.slice(1)}</b><span>${c.skills[x]}%</span></div><div class="bar"><i style="width:${c.skills[x]}%"></i></div></div>`).join("")}</div></div>
 <div class="sectionTitle"><div><h3>🔊 Listening pronunciation library</h3><p>Store your own audio for clearer, consistent pronunciation support.</p></div></div><div class="card">${audioManager()}</div>
 <div class="sectionTitle"><div><h3>🎤 Speaking recordings</h3><p>Children can record, replay, and optionally save their voice for parent review.</p></div></div><div class="card"><div class="quest"><div><h4>Save speaking clips to Firebase Storage</h4><p>Keep this on only if you want the recordings stored. Turn it off anytime.</p></div><button class="secondary" onclick="toggleSpeakingSave()">${state.saveSpeakingRecordings?"ON ✓":"OFF"}</button></div>
 ${recent.length?recent.map((r,i)=>`<div class="quest"><div><h4>${esc(r.childName||"Child")} · ${esc(r.lessonTitle||"Speaking practice")}</h4><p>${r.transcript?`Transcript: “${esc(r.transcript)}” · `:""}${r.createdAt?new Date(r.createdAt).toLocaleString():""}</p><div id="recplay-${i}"></div></div><button class="secondary" onclick="playCloudRecording('${esc(r.storagePath)}','recplay-${i}')">▶ Listen</button></div>`).join(""):`<p style="color:var(--muted)">No saved speaking clips yet.</p>`}</div>
 <div class="sectionTitle"><div><h3>Controls</h3><p>Parent PIN protects the in-app dashboard.</p></div></div><div class="card"><div class="quest"><div><h4>Parent PIN</h4><p>Current PIN: <b>${state.parentPin}</b></p></div><button class="secondary" onclick="changePin()">Change PIN</button></div><div class="quest"><div><h4>Backup progress</h4><p>Export current state as JSON.</p></div><button class="secondary" onclick="exportData()">Export</button></div><div class="quest"><div><h4>Reset local app</h4><p>Cloud data is not deleted by this button.</p></div><button class="secondary" onclick="resetApp()">Reset local</button></div></div>
 <div class="sectionTitle"><div><h3>Reward requests</h3><p>Redeemed rewards are fulfilled by a parent.</p></div></div><div class="card">${state.rewardClaims.length?state.rewardClaims.slice().reverse().map(x=>`<div class="quest"><div><h4>${x.child} requested ${x.reward}</h4><p>${new Date(x.time).toLocaleString()}</p></div><span class="badge">${x.status}</span></div>`).join(""):`<p style="color:var(--muted)">No reward claims yet.</p>`}</div>`;
}

function navigate(page){
 document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
 document.querySelector("#page-"+page).classList.remove("hidden");
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 if(page==="home")renderHome(); if(page==="learn")renderLearn(); if(page==="quests")renderQuests(); if(page==="rewards")renderRewards(); if(page==="parent")showParentGate();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>navigate(b.dataset.page));

function showParentGate(){
 const root=document.querySelector("#page-parent");
 root.innerHTML=`${topbar("Parent Dashboard","Protected family controls.")}<div class="card" style="max-width:520px;margin:30px auto;text-align:center"><div style="font-size:52px">🔐</div><h3>Parent access</h3><p style="color:var(--muted)">Enter your parent PIN. Demo PIN is <b>2468</b>.</p><div class="inputRow"><input id="pinInput" type="password" inputmode="numeric" placeholder="PIN"><button class="bigPrimary" onclick="checkPin()">Open</button></div></div>`;
}
function checkPin(){if(document.querySelector("#pinInput").value===state.parentPin)renderParent();else alert("Incorrect PIN")}

function startWorld(id){
 const ls=lessons[id]||[]; const next=ls.find(l=>!child().completedLessons.includes(l.id))||ls[0];
 if(!next){alert("This world is coming soon.");return}
 openLesson(id,next,Math.max(0,ls.indexOf(next)));
}
function openLesson(worldId,l,idx){
 selectedChoice=null;spokenOk=false;recognizedText="";recordedBlob=null;if(recordedUrl)URL.revokeObjectURL(recordedUrl);recordedUrl=null;
 const root=document.querySelector("#modalRoot");
 root.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><span class="badge">${worlds.find(w=>w.id===worldId)?.name||"Mission"}</span><h2 style="margin:7px 0">${l.title}</h2></div><button class="close" onclick="closeModal()">✕</button></div>
 <div class="progressLine"><i style="width:${((idx+1)/Math.max(1,(lessons[worldId]||[]).length))*100}%"></i></div>
 <div class="lessonMascot"><div class="mascot">🐲</div><div><b>龍龍說：</b><p>${l.zh}</p><small style="color:var(--muted)">中文幫你理解任務，英文由你完成！</small></div></div>
 <div class="taskBox">${taskHTML(l)}</div><div id="feedback"></div>
 <div class="actionRow"><span><span class="coin">+${l.coins} 🪙</span> · <span class="xp">+${l.xp} XP</span></span><button class="bigPrimary" onclick="checkTask('${worldId}','${l.id}',${idx})">Check answer ✨</button></div></div></div>`;
 if(LISTENING_TEXT[l.id])setTimeout(()=>playLessonAudio(l.id),350);
}
function listeningSupport(l){return LISTENING_TEXT[l.id]?`<div class="recordBox"><b>👂 Listening support</b><br><button class="secondary" style="margin-top:8px" onclick="playLessonAudio('${l.id}')">🔊 Play pronunciation</button><span class="badge" style="margin-left:8px">${state.audioOverrides?.[l.id]?"Your audio":"Voice fallback"}</span></div>`:""}
function taskHTML(l){
 const listen=listeningSupport(l);
 if(l.type==="choice")return `<h3>${l.prompt}</h3>${listen}<div class="choices">${l.choices.map(c=>`<button class="choice" data-value="${esc(c)}" onclick="selectChoice(this)">${c}</button>`).join("")}</div>`;
 if(l.type==="text")return `<h3>${l.prompt}</h3>${listen}<div class="inputRow"><input id="textAnswer" autocomplete="off" placeholder="Type your answer…"></div>`;
 if(l.type==="speak")return `<h3>${l.prompt}</h3>${listen}<div class="recordBox"><b>🎤 Speaking studio</b><p style="color:var(--muted);margin:7px 0">Record your voice, replay it, and use speech transcription where supported.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="bigPrimary" id="recordBtn" onclick="toggleRecording()">🎙️ Start recording</button><button class="secondary" onclick="startRecognition()">📝 Listen & transcribe</button><button class="secondary" onclick="markSpoken()">✓ I said it</button></div><div id="recordStatus" style="margin-top:10px;color:var(--muted)"></div><div id="speechResult" style="margin-top:8px;color:var(--muted)"></div><div id="recordPlayback"></div></div>`;
}
let selectedChoice=null, spokenOk=false, recognizedText="";
function selectChoice(el){selectedChoice=el.dataset.value;document.querySelectorAll(".choice").forEach(x=>x.style.borderColor="");el.style.borderColor="var(--primary)"}
function markSpoken(){spokenOk=true;document.querySelector("#speechResult").innerHTML="✅ Great effort!";}

function normalize(s){return String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^\p{L}\p{N}\s']/gu,"").replace(/\s+/g," ").trim()}
async function checkTask(worldId,id,idx){
 const l=(lessons[worldId]||[]).find(x=>x.id===id); let ok=false;
 if(l.type==="choice")ok=normalize(selectedChoice)===normalize(l.answer);
 if(l.type==="text"){
   const v=document.querySelector("#textAnswer")?.value||"";
   ok=l.answerFree?v.trim().length>=2:l.answerAnyNumber?/^\d+$/.test(v.trim()):normalize(v)===normalize(l.answer);
 }
 if(l.type==="speak"){
   if(l.allowAnySpeech) ok=spokenOk || recognizedText.trim().split(/\s+/).length>=3 || !!recordedBlob;
   else if(l.allowContains) ok=spokenOk || normalize(recognizedText).includes(normalize(l.speechTarget)) || !!recordedBlob;
   else ok=spokenOk || similarity(normalize(recognizedText),normalize(l.speechTarget))>=0.55 || !!recordedBlob;
 }
 const fb=document.querySelector("#feedback");
 if(!ok){fb.innerHTML=`<div class="speech" style="border-color:#ffc1ce;background:#fff2f5"><b>再試一次！</b><br><span style="color:var(--muted)">You're close. Listen, look carefully, and try again.</span></div>`;return}
 if(l.type==="speak"&&recordedBlob&&state.saveSpeakingRecordings) await saveSpeakingRecording(worldId,l);
 completeLesson(worldId,l,idx);
}
function similarity(a,b){
 if(!a||!b)return 0; const A=new Set(a.split(" ")),B=new Set(b.split(" "));let hit=0;A.forEach(x=>{if(B.has(x))hit++});return hit/Math.max(A.size,B.size)
}
function completeLesson(worldId,l,idx){
 const c=child(); if(!c.completedLessons.includes(l.id)){
   c.completedLessons.push(l.id); c.coins+=l.coins; c.xp+=l.xp;
   c.skills[l.skill]=Math.min(100,c.skills[l.skill]+Math.max(2,Math.round(l.xp/3)));
   updateStreak(c); save();
 }
 const arr=lessons[worldId]||[]; const next=arr[idx+1];
 document.querySelector("#modalRoot").innerHTML=`<div class="modalBackdrop"><div class="modal" style="text-align:center"><div class="confetti">🎉 ⭐ 🎉</div><h2>Mission complete!</h2><p>龍龍說：<b>太棒了！你真的在進步！</b></p><div style="font-size:20px;margin:18px"><span class="coin">+${l.coins} Coins</span> · <span class="xp">+${l.xp} XP</span></div>
 ${next?`<button class="bigPrimary" onclick='openNext("${worldId}","${next.id}",${idx+1})'>Next mission →</button>`:`<button class="bigPrimary" onclick="closeModal();navigate('learn')">Back to map</button>`}</div></div>`;
 refreshMini();
}
function openNext(worldId,id,idx){const l=(lessons[worldId]||[]).find(x=>x.id===id);openLesson(worldId,l,idx)}
function updateStreak(c){
 const t=today(); if(c.lastLearn===t)return;
 if(!c.lastLearn){c.streak=1}else{
   const d1=new Date(c.lastLearn), d2=new Date(t), diff=(d2-d1)/86400000;
   c.streak=diff<=1.1?c.streak+1:1;
 } c.lastLearn=t;
}
function closeModal(){if(mediaRecorder&&mediaRecorder.state==="recording")mediaRecorder.stop();document.querySelector("#modalRoot").innerHTML=""}
function speak(text){if("speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}else alert("Speech playback is not supported in this browser.")}
async function playLessonAudio(id){
 const path=state.audioOverrides?.[id];if(path&&fbStorage&&fbUser){try{let url=audioCache[path];if(!url){url=await fbStorage.ref(path).getDownloadURL();audioCache[path]=url}const a=new Audio(url);await a.play();return}catch(e){console.warn(e)}}
 const text=LISTENING_TEXT[id];if(text)speak(text);
}
async function uploadLessonAudio(){
 if(!fbUser||!fbStorage){alert("Connect and sign in to Firebase first.");return}
 const lessonId=document.querySelector("#audioLessonSelect")?.value,file=document.querySelector("#audioFileInput")?.files?.[0];if(!lessonId||!file){alert("Choose a lesson and an audio file.");return}
 try{const safe=file.name.replace(/[^\w.\-]/g,"_");const path=`users/${fbUser.uid}/pronunciation/${lessonId}/${Date.now()}_${safe}`;await fbStorage.ref(path).put(file,{contentType:file.type||"audio/mpeg"});state.audioOverrides[lessonId]=path;save();alert("Pronunciation audio uploaded.");renderParent()}catch(e){alert("Audio upload failed: "+e.message)}
}
async function toggleRecording(){
 if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return}
 if(!navigator.mediaDevices?.getUserMedia){alert("Microphone recording is not supported in this browser.");return}
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];mediaRecorder=new MediaRecorder(stream);recordingStartedAt=Date.now();
 mediaRecorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};mediaRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());recordedBlob=new Blob(recordChunks,{type:mediaRecorder.mimeType||"audio/webm"});recordedUrl=URL.createObjectURL(recordedBlob);const p=document.querySelector("#recordPlayback"),x=document.querySelector("#recordStatus"),b=document.querySelector("#recordBtn");if(p)p.innerHTML=`<audio class="audioPlayer" controls src="${recordedUrl}"></audio>`;if(x)x.innerHTML=`✅ Recorded ${Math.max(1,Math.round((Date.now()-recordingStartedAt)/1000))} seconds. Listen back before submitting.`;if(b)b.textContent="🎙️ Record again"};
 mediaRecorder.start();const b=document.querySelector("#recordBtn"),x=document.querySelector("#recordStatus");if(b)b.innerHTML='<span class="recordPulse"></span>Stop recording';if(x)x.textContent="Recording… speak naturally.";
 }catch(e){alert("Microphone permission was not granted: "+e.message)}
}
function startRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){const x=document.querySelector("#speechResult");if(x)x.innerHTML="Speech transcription is not supported in this browser. Your audio recording can still be replayed and submitted.";return}
 const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;const x=document.querySelector("#speechResult");if(x)x.innerHTML="🎧 Listening for words…";
 r.onresult=e=>{recognizedText=e.results[0][0].transcript;if(x)x.innerHTML=`I heard: <b>${esc(recognizedText)}</b>`};r.onerror=()=>{if(x)x.innerHTML="I couldn't transcribe that clearly. Retry or submit the recording."};r.start();
}
async function saveSpeakingRecording(worldId,l){
 if(!fbUser||!fbStorage)return;try{const id=`${Date.now()}_${state.activeChild}_${l.id}`,path=`users/${fbUser.uid}/speaking/${state.activeChild}/${id}.webm`;await fbStorage.ref(path).put(recordedBlob,{contentType:recordedBlob.type||"audio/webm"});state.speakingRecordings.push({childId:state.activeChild,childName:child().name,worldId,lessonId:l.id,lessonTitle:l.title,transcript:recognizedText||"",storagePath:path,createdAt:new Date().toISOString()});state.speakingRecordings=state.speakingRecordings.slice(-60);save()}catch(e){console.warn("Speaking upload failed",e)}
}
async function playCloudRecording(path,targetId){if(!fbStorage||!fbUser)return;try{let url=audioCache[path];if(!url){url=await fbStorage.ref(path).getDownloadURL();audioCache[path]=url}const el=document.getElementById(targetId);if(el)el.innerHTML=`<audio class="audioPlayer" controls autoplay src="${url}"></audio>`}catch(e){alert("Could not play recording: "+e.message)}}
function toggleSpeakingSave(){state.saveSpeakingRecordings=!state.saveSpeakingRecordings;save();renderParent()}

function submitChore(id){
 const c=child(); if(!c.pendingChores.includes(id))c.pendingChores.push(id);save();renderQuests();
}
function approveChore(id){
 const c=child(),q=state.chores.find(x=>x.id===id);if(!q)return;
 c.pendingChores=c.pendingChores.filter(x=>x!==id);c.coins+=q.coins;c.completedChores[today()]=(c.completedChores[today()]||[]).concat(id);save();renderParent();refreshMini();
}
function rejectChore(id){child().pendingChores=child().pendingChores.filter(x=>x!==id);save();renderParent()}
function setGoal(id){child().goal=id;save();renderRewards()}
function buyReward(id){
 const c=child(),r=rewards.find(x=>x.id===id);if(!r||c.coins<r.price)return;
 if(!confirm(`Redeem ${r.name} for ${r.price} coins?`))return;
 c.coins-=r.price;state.rewardClaims.push({child:c.name,reward:r.name,price:r.price,time:new Date().toISOString(),status:"Needs parent fulfillment"});save();renderRewards();refreshMini();
 alert("Reward requested! Ask a parent to check the Parent Dashboard.");
}
function switchChild(id){state.activeChild=id;save();refreshMini();renderParent()}
function addChild(){
 const name=prompt("Child's name:");if(!name)return;const id="child_"+Date.now();
 state.children[id]={name,avatar:"🧒",xp:0,coins:0,streak:0,lastLearn:null,skills:{listening:0,speaking:0,reading:0,writing:0},completedLessons:[],completedChores:{},pendingChores:[],goal:"story"};
 state.activeChild=id;save();refreshMini();renderParent();
}
function changePin(){const p=prompt("New 4-digit parent PIN:");if(/^\d{4}$/.test(p)){state.parentPin=p;save();alert("PIN updated.")}else if(p)alert("Please use exactly 4 digits.")}
function exportData(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="linguaquest-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function resetApp(){if(confirm("Reset all LinguaQuest data on this browser?")){state=structuredClone(defaultState);save();refreshMini();navigate("home")}}
function refreshMini(){document.querySelector("#sideAvatar").textContent=child().avatar;document.querySelector("#sideName").textContent=child().name;document.querySelector("#sideLevel").textContent=levelName(child().xp)}

refreshMini();renderHome();renderLearn();renderQuests();renderRewards();initFirebase();
</script>
</body>
</html>
