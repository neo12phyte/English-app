<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<title>LinguaQuest 親子英語 · Family English Adventure</title>
<style>
:root{
  --bg:#f7f7fb; --card:#ffffff; --ink:#1d2440; --muted:#6f7690;
  --primary:#6c5ce7; --primary2:#8b7cf6; --accent:#ffb703; --good:#19b37d;
  --bad:#ef476f; --blue:#4ea8de; --orange:#ff8a4c; --border:#e8e9f2;
  --shadow:0 14px 32px rgba(55,48,107,.10); --radius:24px;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); background:
  radial-gradient(circle at 10% 0%, #ede9ff 0, transparent 28%),
  radial-gradient(circle at 90% 10%, #fff0d4 0, transparent 25%), var(--bg);
  font-family:Inter,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
.sidebar{
  padding:26px 18px; background:rgba(255,255,255,.82); backdrop-filter:blur(14px);
  border-right:1px solid var(--border); position:sticky; top:0; height:100vh;
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 24px}
.brandMark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),#9b5de5); color:#fff;font-size:27px;box-shadow:var(--shadow)}
.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}
.nav{display:grid;gap:8px}
.nav button{
  width:100%; border:0; background:transparent; color:var(--muted); padding:13px 14px;
  border-radius:16px; text-align:left; font-weight:750; display:flex; gap:11px;align-items:center
}
.nav button.active,.nav button:hover{background:#f0edff;color:var(--primary)}
.sideBottom{position:absolute;bottom:22px;left:18px;right:18px}
.profileMini{padding:12px;border:1px solid var(--border);border-radius:18px;background:#fff;display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#eee9ff}
.main{padding:26px 32px 70px;max-width:1400px;width:100%;margin:auto}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}
.greeting h2{margin:0 0 6px;font-size:28px}.greeting p{margin:0;color:var(--muted)}
.topstats{display:flex;gap:10px;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:10px 14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.hero{grid-column:span 8;min-height:280px;background:linear-gradient(135deg,#6250dc,#8a76f3);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.10);right:-40px;top:-35px}
.hero .eyebrow{opacity:.83;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero h3{font-size:34px;max-width:560px;margin:14px 0 10px}.hero p{max-width:600px;line-height:1.6;opacity:.93}
.primary{border:0;border-radius:16px;padding:13px 18px;background:#fff;color:var(--primary);font-weight:900}
.secondary{border:1px solid var(--border);border-radius:14px;padding:11px 15px;background:#fff;color:var(--ink);font-weight:800}
.heroActions{display:flex;gap:10px;margin-top:22px}
.companionCard{grid-column:span 4;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.mascot{font-size:80px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.12));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.speech{margin-top:10px;background:#fff9df;border:1px solid #ffe58f;border-radius:18px;padding:14px 16px;line-height:1.5}
.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:28px 0 12px}
.sectionTitle h3{margin:0;font-size:22px}.sectionTitle p{margin:4px 0 0;color:var(--muted);font-size:14px}
.skill{grid-column:span 3}
.skillTop{display:flex;justify-content:space-between;align-items:center}.skillIcon{font-size:27px}
.bar{height:10px;background:#eef0f6;border-radius:999px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));border-radius:999px}
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.world{position:relative;border:1px solid var(--border);background:#fff;border-radius:20px;padding:18px;text-align:left;min-height:150px;box-shadow:0 8px 20px rgba(0,0,0,.04)}
.world:hover{transform:translateY(-2px);transition:.2s;box-shadow:var(--shadow)}
.world.locked{opacity:.56;filter:saturate(.7)}
.world .tag{font-size:12px;font-weight:900;color:var(--primary);background:#f0edff;padding:6px 9px;border-radius:999px;display:inline-block}
.world h4{margin:13px 0 6px;font-size:18px}.world p{color:var(--muted);margin:0;line-height:1.45;font-size:14px}
.world .emoji{font-size:35px;position:absolute;right:16px;top:16px}
.questList,.rewardGrid,.childGrid{display:grid;gap:14px}
.quest{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.quest h4{margin:0 0 4px}.quest p{margin:0;color:var(--muted);font-size:14px}
.coin{font-weight:900;color:#b56b00}.xp{font-weight:900;color:var(--primary)}
.rewardGrid{grid-template-columns:repeat(3,1fr)}
.reward{padding:18px;border:1px solid var(--border);border-radius:20px;background:#fff}
.reward .art{font-size:46px}.reward h4{margin:10px 0 4px}.reward p{color:var(--muted);min-height:40px;margin:0 0 12px}
.price{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:850;font-size:12px;background:#f2f4f8;color:#606980}
.tabstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabstrip button{border:1px solid var(--border);background:#fff;padding:9px 12px;border-radius:999px;font-weight:800;color:var(--muted)}.tabstrip button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.hidden{display:none!important}
.modalBackdrop{position:fixed;inset:0;background:rgba(25,25,46,.52);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:50}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:30px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{border:0;background:#f2f3f8;border-radius:50%;width:40px;height:40px}
.lessonMascot{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:center;background:#fff9df;border:1px solid #ffe6a7;border-radius:20px;padding:14px;margin:18px 0}
.lessonMascot .mascot{font-size:58px}.lessonMascot p{margin:3px 0;line-height:1.5}
.taskBox{padding:20px;border:1px solid var(--border);border-radius:22px;background:#fbfbfe}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.choice{padding:14px;border-radius:15px;background:#fff;border:2px solid var(--border);font-weight:800}
.choice:hover{border-color:#bdb4ff}.choice.good{border-color:var(--good);background:#ecfbf5}.choice.bad{border-color:var(--bad);background:#fff0f3}
.inputRow{display:flex;gap:10px;margin-top:14px}.inputRow input{flex:1;padding:13px 14px;border:2px solid var(--border);border-radius:14px;outline:none}.inputRow input:focus{border-color:var(--primary)}
.actionRow{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.bigPrimary{border:0;border-radius:15px;padding:13px 18px;background:var(--primary);color:#fff;font-weight:900}
.progressLine{height:10px;background:#eceef5;border-radius:999px;overflow:hidden;margin:14px 0}.progressLine i{height:100%;display:block;background:linear-gradient(90deg,var(--primary),#19b37d)}
.confetti{font-size:50px;text-align:center}
.parentGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:14px}.table th{color:var(--muted)}
.switcher{display:flex;gap:8px;flex-wrap:wrap}.childBtn{border:1px solid var(--border);background:#fff;border-radius:14px;padding:10px 12px;font-weight:800}.childBtn.active{border-color:var(--primary);background:#f0edff;color:var(--primary)}
.notice{padding:14px 16px;border-radius:16px;background:#eef8ff;color:#23658f;border:1px solid #cfeaff}
.goal{background:linear-gradient(135deg,#fff4d6,#fff);border:1px solid #ffe1a0}
.goal .bar i{background:linear-gradient(90deg,#ffb703,#ff8a4c)}
.footer{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
@media(max-width:980px){
 .app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:30;bottom:0;top:auto;height:auto;width:100%;padding:8px 10px;border-right:0;border-top:1px solid var(--border)}
 .brand,.sideBottom{display:none}.nav{grid-template-columns:repeat(5,1fr)}.nav button{justify-content:center;text-align:center;font-size:11px;flex-direction:column;gap:3px;padding:7px 4px}.main{padding:22px 18px 100px}
 .hero,.companionCard{grid-column:span 12}.skill{grid-column:span 6}.worlds,.rewardGrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
 .topbar{align-items:flex-start;flex-direction:column}.greeting h2{font-size:24px}.hero h3{font-size:27px}.skill{grid-column:span 12}.worlds,.rewardGrid,.parentGrid{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.lessonMascot{grid-template-columns:64px 1fr}.lessonMascot .mascot{font-size:46px}
}

/* V2 lively game layer */
:root{--primary:#7c3aed;--primary2:#a855f7;--accent:#ffca3a;--pink:#ff5da2;--green:#23c483;--blue:#45a3ff}
body{background:radial-gradient(circle at 7% 3%,rgba(255,202,58,.20),transparent 22%),radial-gradient(circle at 92% 5%,rgba(255,93,162,.16),transparent 25%),radial-gradient(circle at 40% 100%,rgba(69,163,255,.14),transparent 32%),#f8f7ff}
.brandMark{background:linear-gradient(135deg,var(--primary),var(--pink));box-shadow:0 12px 28px rgba(124,58,237,.28);position:relative;overflow:hidden}
.brandMark:after{content:"";position:absolute;width:24px;height:70px;background:rgba(255,255,255,.25);transform:rotate(30deg);left:-30px;animation:shine 4s infinite}@keyframes shine{0%,65%{left:-30px}85%,100%{left:75px}}
.nav button{transition:.18s}.nav button:hover{transform:translateX(3px)}
.hero{background:radial-gradient(circle at 90% 15%,rgba(255,255,255,.18),transparent 27%),linear-gradient(135deg,#6836d8,#8d52ee 57%,#cb59ca)}
.hero:before{content:"✨";font-size:88px;position:absolute;right:34px;bottom:18px;opacity:.18;transform:rotate(12deg)}
.world,.reward{transition:.2s}.world:hover,.reward:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.rewardGrid{grid-template-columns:repeat(4,1fr)}
.cloudOnline{color:#117a58}.cloudLocal{color:#805b12}
.cloudBox{background:linear-gradient(135deg,#f0edff,#fff);border:1px solid #dcd4ff}
.formField{display:grid;gap:6px;margin:12px 0}.formField label{font-size:13px;font-weight:850;color:var(--muted)}
.formField input,.formField textarea,.formField select{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:15px;outline:none;background:#fff}
.recordBox{margin-top:14px;padding:14px;border-radius:18px;border:1px solid #dfe4f4;background:#f8faff}
.recordPulse{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--bad);margin-right:7px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
.audioPlayer{width:100%;margin-top:12px}
.notice.good{background:#ecfbf5;color:#147253;border-color:#c9f1df}.notice.warn{background:#fff8e2;color:#7f5b13;border-color:#ffe4a0}
.starBurst{position:fixed;pointer-events:none;font-size:24px;z-index:100;animation:burst .8s forwards}@keyframes burst{to{transform:translateY(-80px) rotate(80deg) scale(1.8);opacity:0}}
@media(max-width:1100px){.rewardGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:980px){.rewardGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.rewardGrid{grid-template-columns:1fr}}


/* Login-first family setup */
.authGate{
  position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,202,58,.28),transparent 24%),
    radial-gradient(circle at 85% 12%,rgba(255,93,162,.22),transparent 26%),
    radial-gradient(circle at 50% 100%,rgba(69,163,255,.20),transparent 34%),
    linear-gradient(145deg,#f7f2ff,#fffaf0);
}
.authShell{width:min(940px,100%);display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border:1px solid var(--border);border-radius:34px;overflow:hidden;box-shadow:0 30px 90px rgba(75,48,132,.20)}
.authArt{min-height:570px;padding:42px;background:linear-gradient(145deg,#6f3ce0,#a653e7 58%,#f15aa5);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.authArt:before,.authArt:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.authArt:before{width:270px;height:270px;right:-80px;top:-65px}.authArt:after{width:210px;height:210px;left:-70px;bottom:20px}
.authDragon{font-size:120px;filter:drop-shadow(0 15px 18px rgba(0,0,0,.18));animation:float 3s ease-in-out infinite;position:relative;z-index:1}
.authArt h1{font-size:42px;line-height:1.08;margin:12px 0}.authArt p{line-height:1.65;opacity:.94;max-width:430px}
.authFeatures{display:grid;gap:10px;position:relative;z-index:1}.authFeature{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:11px 13px;border-radius:15px;font-weight:800}
.authForm{padding:42px;display:flex;flex-direction:column;justify-content:center}
.authForm h2{font-size:29px;margin:0 0 8px}.authForm>p{color:var(--muted);line-height:1.55;margin:0 0 18px}
.authError{display:none;padding:12px 14px;border-radius:14px;background:#fff0f3;border:1px solid #ffcbd7;color:#a82e4a;margin:12px 0;line-height:1.45}
.authError.show{display:block}.authActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.authHint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
.avatarChoices{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.avatarChoice{font-size:30px;width:58px;height:58px;border-radius:18px;border:2px solid var(--border);background:#fff}.avatarChoice.active{border-color:var(--primary);background:#f1eaff;box-shadow:0 7px 18px rgba(124,58,237,.14)}
.loadingDots{font-size:18px;letter-spacing:6px;animation:pulse 1.1s infinite}
@media(max-width:760px){.authShell{grid-template-columns:1fr}.authArt{min-height:250px;padding:28px}.authDragon{font-size:75px}.authArt h1{font-size:31px}.authFeatures{display:none}.authForm{padding:28px}}


.vocabStrip{margin:0 0 16px;padding:14px;border:1px solid #e8e3ff;border-radius:18px;background:linear-gradient(135deg,#f6f2ff,#fff)}
.vocabStripTop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}
.vocabStripTop b{font-size:14px}.vocabStripTop span{font-size:12px;color:var(--muted);font-weight:800}
.vocabChips{display:flex;gap:7px;flex-wrap:wrap}.vocabChip{padding:6px 9px;border-radius:999px;background:#fff;border:1px solid #ddd5ff;font-size:13px;font-weight:800}
.arrangeZone{min-height:58px;border:2px dashed #d8d4ea;border-radius:16px;padding:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:13px 0;background:#fff}
.arrangeZone.empty:before{content:"Tap the words below…";color:var(--muted);font-size:14px}
.arrangeChip{border:1px solid #d8d4ea;background:#fff;padding:9px 11px;border-radius:13px;font-weight:800}.arrangeChip:disabled{opacity:.3}
.curriculumStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0 22px}
.curriculumStat{background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow2)}
.curriculumStat strong{font-size:24px;display:block}.curriculumStat small{color:var(--muted);font-weight:700}
.dayBadge{display:inline-flex;gap:7px;align-items:center;padding:6px 10px;border-radius:999px;background:#fff;color:var(--primary);font-size:12px;font-weight:900}
@media(max-width:720px){.curriculumStats{grid-template-columns:repeat(2,1fr)}}


/* Bilingual + visual learning upgrade */
.nav button span{line-height:1.1}.nav button span small{display:block;font-size:10px;font-weight:700;color:inherit;opacity:.72;margin-top:2px}
.bilingual{display:block}.bilingual small{display:block;color:var(--muted);font-weight:700;margin-top:2px}
.visualStrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin:14px 0}
.visualCard{background:linear-gradient(180deg,#fff,#f8f5ff);border:2px solid #ece6ff;border-radius:20px;padding:13px 8px;text-align:center;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 18px rgba(76,50,124,.06)}
.visualCard.small{min-height:112px;padding:10px 6px}.visualEmoji{font-size:48px;line-height:1.1;filter:drop-shadow(0 5px 5px rgba(0,0,0,.10))}
.visualCard.small .visualEmoji{font-size:40px}.visualEn{font-weight:900;margin-top:7px;font-size:15px}.visualZh{font-size:12px;color:var(--muted);margin-top:2px;font-weight:700}
.letterStage{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:stretch;margin:12px 0}
.letterPanel{background:linear-gradient(145deg,#efe9ff,#fff);border:2px solid #ded4ff;border-radius:25px;min-height:225px;display:grid;place-items:center;text-align:center;padding:18px}
.bigLetters{font-size:94px;font-weight:1000;letter-spacing:10px;color:var(--primary);line-height:1}
.letterLabels{display:flex;justify-content:center;gap:24px;color:var(--muted);font-size:12px;font-weight:900;margin-top:10px}
.soundPill{display:inline-block;background:#fff4c8;border:1px solid #ffdc69;border-radius:999px;padding:8px 12px;font-weight:900;margin-top:12px}
.pictureHero{background:linear-gradient(145deg,#fff7d7,#fff);border:2px solid #ffe594;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.pictureHero .heroEmoji{font-size:92px;line-height:1;filter:drop-shadow(0 8px 8px rgba(0,0,0,.12))}
.pictureHero h3{margin:10px 0 2px;font-size:24px}.pictureHero p{margin:0;color:var(--muted);font-weight:750}
.imageChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}
.imageChoice{border:2px solid var(--border);background:#fff;border-radius:22px;padding:10px;transition:.18s}.imageChoice:hover{border-color:#bbaeff;transform:translateY(-2px)}
.imageChoice.selected{border-color:var(--primary);background:#f5f0ff;box-shadow:0 8px 20px rgba(124,58,237,.12)}
.imageChoice .visualCard{border:0;box-shadow:none;background:transparent;min-height:120px}
.alphaReviewBoard{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.alphaTile{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#f0ebff,#fff);border:2px solid #e1d8ff;color:var(--primary);font-weight:1000;font-size:25px}
.traceWrap{position:relative;height:235px;border-radius:24px;border:2px dashed #cfc5ee;background:#fdfcff;overflow:hidden;touch-action:none;margin-top:14px}
.traceGhost{position:absolute;inset:0;display:grid;place-items:center;font-size:112px;font-weight:1000;color:#ebe6f8;letter-spacing:28px;pointer-events:none;user-select:none}
#traceCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}
.traceTools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;color:var(--muted);font-size:13px}
.chantCard{background:linear-gradient(135deg,#fff1c7,#ffe8f4);border:2px solid #ffdb85;border-radius:25px;padding:24px;text-align:center;margin-top:12px}
.chantCard .beat{font-size:32px;font-weight:1000;line-height:1.45}.chantCard .zhHint{color:var(--muted);font-weight:750;margin-top:7px}
.taskBilingualHint{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.vocabStripTop b::after{content:" · 今日學習";font-size:12px;color:var(--muted);font-weight:700}
.hero .dayBadge{margin-bottom:8px}
@media(max-width:700px){.letterStage{grid-template-columns:1fr}.bigLetters{font-size:78px}.pictureHero .heroEmoji{font-size:75px}.imageChoices{grid-template-columns:1fr 1fr}.traceGhost{font-size:86px}}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brandMark">龍</div><div><h1>LinguaQuest</h1><small>Family English Adventure</small></div></div>
    <nav class="nav">
      <button class="active" data-page="home">🏠 <span>首頁<small>Home</small></span></button>

function rotateArray(arr,n){

const lessons={};
CURRICULUM_DATA.forEach((w,wi)=>{
 lessons[w.id]=[];
 w.days.forEach((d,di)=>lessons[w.id].push(...makeDayTasks(w,wi,d,di)));
});
const TOTAL_DAYS=CURRICULUM_DATA.reduce((n,w)=>n+w.days.length,0);
const TOTAL_TASKS=Object.values(lessons).flat().length;

function getDayTasks(worldId,dayNo){return (lessons[worldId]||[]).filter(l=>l.day===dayNo)}
function isDayComplete(c,worldId,dayNo){
 const tasks=getDayTasks(worldId,dayNo);return tasks.length>0&&tasks.every(t=>c.completedLessons.includes(t.id));
}
function completedDaysForWorld(c,worldId){
 const w=CURRICULUM_DATA.find(x=>x.id===worldId);if(!w)return 0;
 return w.days.filter((_,i)=>isDayComplete(c,worldId,i+1)).length;
}
function totalCompletedDays(c){
 let n=0;CURRICULUM_DATA.forEach(w=>{n+=completedDaysForWorld(c,w.id)});return n;
}
function nextDailySession(c){
 for(let wi=0;wi<CURRICULUM_DATA.length;wi++){
  const w=CURRICULUM_DATA[wi];
  for(let d=1;d<=w.days.length;d++){
   if(!isDayComplete(c,w.id,d)){
    const first=getDayTasks(w.id,d).find(t=>!c.completedLessons.includes(t.id))||getDayTasks(w.id,d)[0];
    return {world:w,day:d,globalDay:wi*10+d,lesson:first,index:(lessons[w.id]||[]).indexOf(first)};
   }
  }
 }
 const w=CURRICULUM_DATA[CURRICULUM_DATA.length-1];
 return {world:w,day:10,globalDay:TOTAL_DAYS,lesson:getDayTasks(w.id,10)[0],index:(lessons[w.id]||[]).indexOf(getDayTasks(w.id,10)[0])};
}

async function initFirebase(){
 const cfg=activeFirebaseConfig();
 showConnecting();
 if(!firebaseConfigReady(cfg)){showLoginGate("Firebase configuration is missing.");return false}
 try{
  if(!firebase.apps.length)fbApp=firebase.initializeApp(cfg);else fbApp=firebase.app();

  // Firebase App Check with reCAPTCHA Enterprise.
  // This public site key is safe to include in browser code.
  const fbAppCheck=firebase.appCheck();
  fbAppCheck.activate(
    new firebase.appCheck.ReCaptchaEnterpriseProvider(
      "6LcPBLctAAAAAMV18y2xJV-o9Jp0XVSmt5DqqxI2"
    ),
    true // Automatically refresh App Check tokens.
  );

  fbAuth=firebase.auth();fbDb=firebase.firestore();fbStorage=firebase.storage();
  fbAuth.onAuthStateChanged(u=>{
    fbUser=u||null;
    if(fbUser)startCloudSync();
    else{
      if(fbUnsub)fbUnsub();fbUnsub=null;
      showLoginGate();
    }
  });
  return true;
 }catch(e){console.error(e);showLoginGate("Firebase could not initialize: "+e.message);return false}
}
function startCloudSync(){
 if(!fbUser||!fbDb)return;
 if(fbUnsub)fbUnsub();
 showConnecting();
 const ref=fbDb.doc(`users/${fbUser.uid}/app/state`);
 fbUnsub=ref.onSnapshot(async snap=>{
  if(snap.exists){
    cloudApplying=true;
    const d=snap.data();
    state={...blankFamilyState(),...d,children:{...(d.children||{})}};
    state.audioOverrides=state.audioOverrides||{};
    state.speakingRecordings=state.speakingRecordings||[];
    localStorage.setItem("linguaquest-state",JSON.stringify(state));
    cloudApplying=false;
    if(Object.keys(state.children||{}).length)showMainApp();else showChildSetup();
  }else{
    // New account: NEVER upload old demo/local profiles.
    state=blankFamilyState();
    localStorage.setItem("linguaquest-state",JSON.stringify(state));
    try{
      await ref.set(state);
      showChildSetup();
    }catch(e){
      console.error(e);
      showLoginGate("You signed in, but Firestore blocked access. Finish your Firestore security rules, then sign in again.");
    }
  }
 },e=>{
   console.error("Cloud sync",e);
   showLoginGate("Firebase sign-in worked, but Firestore access is blocked. Please finish the Firestore rules first.");
 });
}
function save(){
 localStorage.setItem("linguaquest-state",JSON.stringify(state));
 if(fbUser&&fbDb&&!cloudApplying){
   clearTimeout(cloudTimer);
   cloudTimer=setTimeout(()=>fbDb.doc(`users/${fbUser.uid}/app/state`).set(state).catch(e=>console.warn("Cloud save",e)),180)
 }
}
async function firebaseLogin(create){
 const email=document.querySelector("#fbEmail")?.value.trim(),password=document.querySelector("#fbPassword")?.value;
 if(!email||!password){showAuthError("Enter both your family email and password.");return}
 if(password.length<6&&create){showAuthError("Firebase passwords need at least 6 characters.");return}
 if(!fbAuth){const ok=await initFirebase();if(!ok)return}
 try{
  showConnecting();
  if(create)await fbAuth.createUserWithEmailAndPassword(email,password);
  else await fbAuth.signInWithEmailAndPassword(email,password);
  // onAuthStateChanged continues the flow.
 }catch(e){
  console.error(e);
  let msg=e.message||"Could not sign in.";
  if(e.code==="auth/operation-not-allowed")msg="Email/Password login is not enabled yet. In Firebase: Authentication → Sign-in method → Email/Password → Enable.";
  if(e.code==="auth/invalid-credential")msg="The email or password is incorrect, or this family account does not exist yet.";
  if(e.code==="auth/email-already-in-use")msg="That email already has an account. Use Sign in instead.";
  if(e.code==="auth/unauthorized-domain")msg="This GitHub Pages domain is not authorized in Firebase Authentication settings.";
  showLoginGate(msg);
 }
}
async function cloudSignOut(){
 if(fbAuth)await fbAuth.signOut();
 fbUser=null;showLoginGate();
}

 canvas.onpointerdown=e=>{traceDrawing=true;traceHasInk=true;canvas.setPointerCapture?.(e.pointerId);const p=pos(e);traceCtx.beginPath();traceCtx.moveTo(p.x,p.y);e.preventDefault()};

function stopRecordingAndWait(){

function startRecognition(auto=false){

   if(x)x.innerHTML="ℹ️ 這個瀏覽器不支援語音轉錄，但錄音成功後仍可完成任務。 Transcription is unavailable in this browser, but a successful recording will still pass.";
   return;

   const r=new SR();speechRecognition=r;speechRecognitionActive=true;

     let finalText="",interim="";
     for(let i=e.resultIndex;i<e.results.length;i++){
       const t=e.results[i][0].transcript;

     }

function approveChore(id){
 const c=child(),q=state.chores.find(x=>x.id===id);if(!q)return;
 c.pendingChores=c.pendingChores.filter(x=>x!==id);c.coins+=q.coins;c.completedChores[today()]=(c.completedChores[today()]||[]).concat(id);save();renderParent();refreshMini();
}
function rejectChore(id){child().pendingChores=child().pendingChores.filter(x=>x!==id);save();renderParent()}
function setGoal(id){child().goal=id;save();renderRewards()}
function buyReward(id){
 const c=child(),r=rewards.find(x=>x.id===id);if(!r||c.coins<r.price)return;
 if(!confirm(`Redeem ${r.name} for ${r.price} coins?`))return;
 c.coins-=r.price;state.rewardClaims.push({child:c.name,reward:r.name,price:r.price,time:new Date().toISOString(),status:"Needs parent fulfillment"});save();renderRewards();refreshMini();
 alert("Reward requested! Ask a parent to check the Parent Dashboard.");
}
function switchChild(id){state.activeChild=id;save();refreshMini();renderParent()}
function addChild(){
 if(!fbUser){showLoginGate("Please sign in to the family account first.");return}
 const name=prompt("孩子名字 · Child name or nickname:");if(!name)return;const id="child_"+Date.now();
 state.children[id]={...emptyChild(),name,avatar:"🧒"};
 state.activeChild=id;state.familyInitialized=true;save();refreshMini();renderParent();
}
function changePin(){const p=prompt("New 4-digit parent PIN:");if(/^\d{4}$/.test(p)){state.parentPin=p;save();alert("PIN updated.")}else if(p)alert("Please use exactly 4 digits.")}
function exportData(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="linguaquest-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function resetApp(){if(confirm("Reset local LinguaQuest data? Cloud data is not deleted.")){localStorage.removeItem("linguaquest-state");location.reload()}}
function refreshMini(){const c=child();const a=document.querySelector("#sideAvatar"),n=document.querySelector("#sideName"),l=document.querySelector("#sideLevel");if(a)a.textContent=c.avatar;if(n)n.textContent=c.name;if(l)l.textContent=levelName(c.xp)}


Object.assign(window,{firebaseLogin,cloudSignOut,chooseSetupAvatar,createFirstChild});

hideMainApp();
showConnecting();
initFirebase();
</script>
